[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alerting-client"
version = "0.1.0"
description = "Notify-only alerting client (Mattermost / webhook). No ACK, no Grafana."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sokan" }]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["alerting_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
